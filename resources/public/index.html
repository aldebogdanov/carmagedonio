<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>carmagedonio</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb7d9; }
      #game { display: block; width: 100vw; height: 100vh; }
      #hud, #help {
        position: fixed; left: 12px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6);
        pointer-events: none; user-select: none;
      }
      #hud  { top: 12px; font-size: 15px; }
      #help { bottom: 12px; opacity: .75; }
      #map {
        position: fixed; right: 12px; bottom: 12px;
        width: 186px; height: 186px;
        border-radius: 4px;
        box-shadow: 0 2px 10px rgba(0,0,0,.45);
        pointer-events: none; user-select: none;
      }
      #where {
        position: fixed; right: 12px; bottom: 204px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7);
        text-align: right; pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">loading physics&hellip;</div>
    <div id="help">WASD / arrows drive &middot; S reverses from a stop &middot; space handbrake &middot; R reset &middot; C camera &middot; B look back &middot; M rivals on map
      <br>?car=muscle | hatchback | pickup | truck | tractor</div>
    <div id="where"></div>
    <canvas id="map" width="372" height="372"></canvas>
    <!-- shared holds the code the page and the chunk worker both use -->
    <script src="/js/shared.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
